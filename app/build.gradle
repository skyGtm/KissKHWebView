plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'com.kisskh.tvweb'; compileSdk 35
    defaultConfig { applicationId 'com.kisskh.tvweb'; minSdk 21; targetSdk 35; versionCode 1; versionName '1.0.0' }
    buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug'; minifyEnabled false }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
}
