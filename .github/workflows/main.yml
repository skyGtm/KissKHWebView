name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace --warning-mode all assembleDebug 2>&1 | tee build.log

      - name: Print compiler diagnostics on failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo '===== COMPILER DIAGNOSTICS ====='
          grep -E '(^e: |^error:|Compilation error|Unresolved reference|Type mismatch|Cannot access|Overload resolution ambiguity|Expecting |Conflicting overloads|None of the following functions)' build.log | tail -n 200 || true
          echo '===== LAST 250 BUILD LOG LINES ====='
          tail -n 250 build.log || true

      - name: Upload failure log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: KissKHWebView-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk KissKHWebView-debug.apk

      - name: Upload workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KissKHWebView-debug
          path: KissKHWebView-debug.apk
          if-no-files-found: error
          retention-days: 14
